<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="910" viewBox="0 0 1774 910" role="img" aria-labelledby="header-title header-desc">
  <title id="header-title">Example Telegram Header — Annotated Guide</title>
  <desc id="header-desc">Synthetic example explaining weekly quota, remaining quota bar, reset time, pace indicator, observed AI model, and a legacy update marker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#eef4fa"/></linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b2d79b"/><stop offset="1" stop-color="#83bda4"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe066"/><stop offset="1" stop-color="#ffb900"/></linearGradient>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1686f5"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#37bc6d"/></marker>
    <marker id="pink-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ee4460"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#854be1"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f98a15"/></marker>
  </defs>
  <rect width="1774" height="910" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="72" font-size="51" font-weight="700" fill="#18263a">Example Telegram Header</text>
    <text x="60" y="119" font-size="27" fill="#617188">A quick guide to quota, model, and status information</text>
  </g>
  <rect x="35" y="156" width="1704" height="233" rx="30" fill="url(#chat)"/>
  <g fill="none" stroke="#6ca883" stroke-width="3" opacity=".25">
    <circle cx="98" cy="222" r="29"/><path d="M75 216l21 18 28-26"/><path d="M155 176l22 22-22 22-22-22z"/><path d="M418 170c30 0 46 38 10 58"/><circle cx="734" cy="181" r="12"/><path d="M1280 160l22 24-20 19M1450 171c17 25 35 25 54 0"/><circle cx="1650" cy="200" r="32"/>
    <path d="M1118 177q25 25 51 0M250 354q18-39 38 0M1545 346l10-28 10 28"/>
  </g>
  <rect x="120" y="202" width="1535" height="165" rx="35" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#141e2e">
    <text x="249" y="281" font-size="41" font-weight="700">W:30%</text>
    <g transform="translate(397 236)">
      <rect width="56" height="57" rx="3" fill="url(#gold)" stroke="#f5b11b" stroke-width="3"/>
      <rect x="61" width="56" height="57" rx="3" fill="url(#gold)" stroke="#f5b11b" stroke-width="3"/>
      <rect x="122" width="56" height="57" rx="3" fill="#d6dade"/>
      <rect x="183" width="56" height="57" rx="3" fill="#d6dade"/>
      <rect x="244" width="56" height="57" rx="3" fill="#d6dade"/>
    </g>
    <text x="736" y="282" font-size="41">~22.10 09:12</text>
    <circle cx="1042" cy="267" r="27" fill="url(#gold)" stroke="#e7a100" stroke-width="3"/>
    <text x="248" y="345" font-size="40">M:openai/gpt-6.1-sol</text>
    <text x="718" y="345" font-size="37">upd 16.10 13:44</text>
  </g>
  <!-- Callouts -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="192" cy="210" r="29" fill="#1686f5"/><text x="192" y="220">1</text>
    <circle cx="488" cy="188" r="29" fill="#37bc6d"/><text x="488" y="198">2</text>
    <circle cx="841" cy="185" r="29" fill="#ee4460"/><text x="841" y="195">3</text>
    <circle cx="1116" cy="190" r="29" fill="#854be1"/><text x="1116" y="200">4</text>
    <circle cx="191" cy="333" r="29" fill="#f98a15"/><text x="191" y="343">5</text>
    <circle cx="1170" cy="346" r="29" fill="#1686f5"/><text x="1170" y="356">6</text>
  </g>
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M216 221L242 250" stroke="#1686f5" marker-end="url(#blue-arrow)"/>
    <path d="M488 218L476 235" stroke="#37bc6d" marker-end="url(#green-arrow)"/>
    <path d="M841 217L819 239" stroke="#ee4460" marker-end="url(#pink-arrow)"/>
    <path d="M1093 208L1062 239" stroke="#854be1" marker-end="url(#purple-arrow)"/>
    <path d="M219 333L246 333" stroke="#f98a15" marker-end="url(#orange-arrow)"/>
    <path d="M1141 346L1090 343" stroke="#1686f5" marker-end="url(#blue-arrow)"/>
  </g>
  <!-- Legend -->
  <rect x="35" y="418" width="1704" height="439" rx="30" fill="#f5f7fa" stroke="#e4e9f0"/>
  <path d="M887 444V820" stroke="#d8e0ea" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="93" cy="484" r="27" fill="#1686f5"/><text x="93" y="495" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">1</text>
    <text x="146" y="477" font-size="27" font-weight="700" fill="#1b2c40">Weekly quota remaining</text>
    <text x="146" y="514" font-size="21" fill="#63748b">W:30% means 30% of the weekly quota remains.</text>
    <circle cx="93" cy="609" r="27" fill="#37bc6d"/><text x="93" y="620" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">2</text>
    <text x="146" y="600" font-size="27" font-weight="700" fill="#1b2c40">Remaining-quota bar</text>
    <text x="146" y="637" font-size="21" fill="#63748b">Five slots approximate the remaining percentage.</text>
    <text x="146" y="669" font-size="21" fill="#63748b">Yellow = low balance; grey = unfilled slots.</text>
    <circle cx="93" cy="756" r="27" fill="#ee4460"/><text x="93" y="767" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">3</text>
    <text x="146" y="747" font-size="27" font-weight="700" fill="#1b2c40">Estimated quota reset</text>
    <text x="146" y="785" font-size="21" fill="#63748b">Approximate date and time of the next reset.</text>
    <circle cx="946" cy="484" r="27" fill="#854be1"/><text x="946" y="495" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">4</text>
    <text x="999" y="477" font-size="27" font-weight="700" fill="#1b2c40">Usage pace</text>
    <text x="999" y="514" font-size="21" fill="#63748b">Yellow = consumption ahead of the even weekly pace.</text>
    <text x="999" y="545" font-size="21" fill="#63748b">Green = on pace; red = critically low.</text>
    <circle cx="946" cy="609" r="27" fill="#f98a15"/><text x="946" y="620" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">5</text>
    <text x="999" y="600" font-size="27" font-weight="700" fill="#1b2c40">Observed AI model</text>
    <text x="999" y="637" font-size="21" fill="#63748b">Model identified from the OpenClaw runtime events.</text>
    <text x="999" y="669" font-size="21" fill="#63748b">Unknown model data is shown as M:? instead.</text>
    <circle cx="946" cy="756" r="27" fill="#1686f5"/><text x="946" y="767" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">6</text>
    <text x="999" y="747" font-size="27" font-weight="700" fill="#1b2c40">Legacy update marker</text>
    <text x="999" y="785" font-size="21" fill="#63748b">Older header format only; omitted by this release.</text>
  </g>
  <text x="887" y="886" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#66788a">Illustrative header • synthetic data • no real account details</text>
</svg>
