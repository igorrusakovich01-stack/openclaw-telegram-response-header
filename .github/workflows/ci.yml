name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-renderer:
    name: Syntax, contracts, and PNG smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image test dependency
        run: python -m pip install --upgrade pillow
      - name: Run checks
        run: bash scripts/check.sh

  upstream-latest:
    name: Probe latest OpenClaw plugin API (best effort)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install upstream latest
        run: npm install -g openclaw@latest
      - name: Show upstream version
        run: openclaw --version
      - name: Install and inspect local plugin
        run: |
          openclaw plugins install --link "$GITHUB_WORKSPACE/plugin" --force --accept-capabilities
          openclaw plugins inspect telegram-response-header --runtime --json > /tmp/telegram-header-inspect.json
          node -e 'const r=require("/tmp/telegram-header-inspect.json"); if(!r.plugin || r.plugin.id!=="telegram-response-header") process.exit(1);'
